<style>
:root{--paper:#fff8ee;--ink:#65594e;--pink:#f4b4c5;--blue:#a9cfe4;--yellow:#f4d78e;--green:#bad9bb;--line:#e9dece;--white:#fffdf9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:ui-rounded,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overscroll-behavior:none}body{background-image:radial-gradient(#e8dccc 1px,transparent 1px);background-size:20px 20px}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0}button:focus-visible{outline:3px solid #b17799;outline-offset:3px}button:active{transform:translateY(2px)}.app{max-width:450px;margin:auto;padding:calc(10px + env(safe-area-inset-top)) 18px calc(12px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.brand{font-size:11px;letter-spacing:2px;font-weight:800;color:#978573}.tools{display:flex;gap:6px}.tool{min-width:38px;height:34px;border:1px solid var(--line);border-radius:12px;background:var(--white);font-size:12px;font-weight:700}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}h1{font-size:25px;letter-spacing:-1.5px;margin:0;font-weight:900}.subtitle{font-size:11px;margin:4px 0 0;color:#988674}.friends{display:flex;align-items:end;gap:3px}.friend{width:37px;height:42px;overflow:visible}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--white);border:1px solid var(--line);border-radius:17px;padding:8px 0;margin-bottom:10px}.stat{text-align:center;border-right:1px dashed var(--line)}.stat:last-child{border:0}.label{font-size:10px;color:#998676;display:block;margin-bottom:3px}.value{font-variant-numeric:tabular-nums;font-size:21px;font-weight:900;line-height:1}.stage{display:flex;justify-content:center;gap:12px;position:relative;align-items:flex-start}.board-frame{padding:7px;border-radius:16px;background:#e9dfd0;box-shadow:0 4px 0 #d9cbb7;position:relative}.board{height:min(47svh,420px);aspect-ratio:1/2;display:block;background:#fffdf9;border-radius:9px;touch-action:none;width:auto;max-width:100%}.side{width:75px;flex-shrink:0;text-align:center;padding-top:3px}.side-title{font-size:10px;font-weight:800;letter-spacing:1px;margin:0 0 7px}.next{width:75px;height:165px;background:#fffdf9;border:1px solid var(--line);border-radius:15px;display:block}.cheer{margin-top:14px;font-size:11px;line-height:1.6}.cheer svg{width:64px;height:70px;display:block;margin:auto}.best{margin-top:12px;padding:9px 1px;border-top:1px dashed #d6c5b2;font-size:10px}.best strong{font-size:14px;display:block;margin-top:3px}.message{height:28px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#9c6d7a}.controls{display:grid;grid-template-columns:1fr 1.05fr 1fr;gap:9px}.control{height:49px;border-radius:16px;background:var(--white);box-shadow:0 3px 0 #dfd2c0;border:1px solid #e1d4c2;font-size:21px;display:flex;align-items:center;justify-content:center;gap:7px;touch-action:none}.control small{font-size:11px;font-weight:800}.rotate{background:#fbe4e9;border-color:#efc7d1;box-shadow:0 3px 0 #dfb4c1}.drop{grid-column:span 2;background:#e0edf4;border-color:#bed6e3;box-shadow:0 3px 0 #b6ccd9;font-size:17px}.down{font-size:19px}.hint{text-align:center;font-size:10px;color:#a08d7b;margin:12px 0 0}.overlay{position:fixed;inset:0;background:#6e5a443d;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:10;padding:22px}.overlay[hidden]{display:none}.card{width:100%;max-width:340px;background:var(--paper);border:3px solid white;border-radius:30px;padding:25px 23px 22px;text-align:center;box-shadow:0 18px 70px #5e453632}.card .mascot{width:150px;height:105px;margin:auto;display:block}.tag{font-size:10px;letter-spacing:2px;color:#ad8a76;margin:9px 0}.card h2{font-size:27px;letter-spacing:-1.2px;line-height:1.25;margin:7px 0 10px}.card p{font-size:13px;line-height:1.8;margin:0 0 17px;color:#907d6c}.modes{display:flex;gap:8px;margin-bottom:14px}.mode{flex:1;border:1px solid #e4d3bc;background:white;border-radius:13px;padding:11px 2px;font-size:12px}.mode[aria-pressed="true"]{border:2px solid #d795aa;background:#fbe7ec;font-weight:800;padding:10px 1px}.primary{width:100%;padding:15px 5px;background:#f1b8c9;box-shadow:0 4px 0 #d79bac;border-radius:16px;font-weight:900;font-size:16px}.secondary{background:none;font-size:12px;margin-top:17px;text-decoration:underline;text-underline-offset:4px}.fine{font-size:10px!important;line-height:1.5!important;margin:16px 0 0!important;color:#a3907f!important}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#65594e;color:white;border-radius:20px;padding:10px 18px;z-index:20;font-size:12px;white-space:nowrap;pointer-events:none}.toast[hidden]{display:none}@media(max-height:720px){.app{padding-top:6px}.heading{margin-bottom:6px}h1{font-size:22px}.stats{padding:6px 0;margin-bottom:7px}.board{height:43svh}.control{height:43px}.message{height:25px}.hint{margin-top:9px}.top{margin-bottom:4px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
[hidden]{display:none!important}
@media(max-height:720px){.control{height:44px}}
/* 왼쪽 여백까지 게임판을 넓히고 오른쪽 미리보기는 유지 */
.stage{justify-content:flex-start}
.board-frame{flex:1;min-width:0}
.board{width:100%;aspect-ratio:auto}
</style>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="white-friend" viewBox="0 0 80 80"><path d="M17 31Q9 12 23 15L31 21Q42 17 50 22Q65 8 69 22L65 36Q79 60 61 69Q38 80 17 66Q4 56 17 31Z" fill="#fffdf9" stroke="#746454" stroke-width="2.5"/><ellipse cx="23" cy="50" rx="8" ry="4" fill="#f5bec9"/><ellipse cx="58" cy="50" rx="8" ry="4" fill="#f5bec9"/><circle cx="28" cy="42" r="2.4" fill="#625246"/><circle cx="52" cy="42" r="2.4" fill="#625246"/><path d="M35 48q5 7 10 0m-5 3v4" fill="none" stroke="#625246" stroke-width="2" stroke-linecap="round"/></symbol>

<symbol id="yellow-friend" viewBox="0 0 80 95"><path d="M22 43Q6 0 20 2Q30 2 34 38H44Q45 0 58 3Q71 6 57 42Q77 54 65 76Q56 91 29 84Q6 77 13 56Z" fill="#f7e3a3" stroke="#746454" stroke-width="2.5"/><ellipse cx="23" cy="65" rx="7" ry="4" fill="#f3b8bb"/><ellipse cx="56" cy="65" rx="7" ry="4" fill="#f3b8bb"/><circle cx="28" cy="56" r="2.4" fill="#625246"/><circle cx="51" cy="56" r="2.4" fill="#625246"/><path d="M35 64q5 6 10 0" fill="none" stroke="#625246" stroke-width="2" stroke-linecap="round"/></symbol>
</defs></svg>
<main class="app">
<header class="top"><span class="brand">서우의 작은 놀이터</span><div class="tools"><button class="tool" id="sound" aria-label="소리 끄기" aria-pressed="true">소리 켬</button><button class="tool" id="music" aria-label="배경음 끄기" aria-pressed="true">음악 켬</button><button class="tool" id="pause" aria-label="일시정지">Ⅱ</button></div></header>
<section class="heading"><div><h1>작은 블록마을</h1><p class="subtitle">먼작귀처럼 작고 귀여운 친구들과 차곡차곡</p></div><div class="friends" aria-hidden="true"><svg class="friend"><use href="#white-friend"/></svg><svg class="friend"><use href="#blue-friend"/></svg><svg class="friend"><use href="#yellow-friend"/></svg></div></section>
<div class="stats"><div class="stat"><span class="label">점수</span><strong class="value" id="score">0</strong></div><div class="stat"><span class="label">지운 줄</span><strong class="value" id="lines">0</strong></div><div class="stat"><span class="label">단계</span><strong class="value" id="level">1</strong></div></div>
<section class="stage" aria-label="게임 영역"><div class="board-frame"><canvas class="board" id="board" width="400" height="800" aria-label="테트리스 게임판. 아래 버튼으로 조작하세요."></canvas></div><aside class="side"><p class="side-title">다음 친구</p><canvas id="next" class="next" width="150" height="330" aria-label="다음 블록 세 개"></canvas><div class="cheer"><svg aria-hidden="true"><use href="#yellow-friend"/></svg><span id="cheer">천천히 해도<br>괜찮아!</span></div><div class="best">최고 점수<strong id="best">0</strong></div></aside></section>
<div class="message" id="message" aria-live="polite">한 줄을 채우면 반짝! 사라져요.</div>
<section class="controls" aria-label="게임 조작"><button class="control" data-action="left" aria-label="왼쪽 이동">←</button><button class="control rotate" data-action="rotate" aria-label="블록 회전">↻ <small>돌리기</small></button><button class="control" data-action="right" aria-label="오른쪽 이동">→</button><button class="control down" data-action="down" aria-label="아래로 이동">↓ <small>살살</small></button><button class="control drop" data-action="drop" aria-label="맨 아래로 바로 내리기">⇓ <small>바로 놓기</small></button></section>
<p class="hint">블록을 톡 누르면 회전 · 좌우로 쓸면 이동</p>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="card"><svg class="mascot" viewBox="0 0 180 115" aria-hidden="true"><use href="#blue-friend" x="0" y="35" width="70" height="70"/><use href="#yellow-friend" x="103" y="7" width="72" height="100"/><use href="#white-friend" x="48" y="30" width="85" height="85"/></svg><div class="tag">서우를 위한 작은 선물</div><h2 id="modalTitle">오늘도 함께<br>차곡차곡!</h2><p id="modalText">알록달록 블록으로 한 줄을 채워 봐.<br>잘 못 놓아도 괜찮아. 다시 하면 되니까!</p><div class="modes" id="modes"><button class="mode" data-mode="easy" aria-pressed="true">느긋하게</button><button class="mode" data-mode="normal" aria-pressed="false">조금 빠르게</button></div><button class="primary" id="start">소리 켜고 시작하기</button><button class="secondary" id="restart" hidden>처음부터 다시 하기</button><p class="fine" id="fine">효과음과 작은 오르골 음악이 나와요.<br>공식 게임이 아닌, 팬 콘셉트의 작은 놀이터예요.</p></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const SHAPES={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]};
const COLORS={I:'#acd9de',O:'#f3d98c',T:'#d4bde2',S:'#bdd9b9',Z:'#efb2c0',J:'#aecde6',L:'#efc4a1'};
const W=10,H=20,canvas=$('board'),ctx=canvas.getContext('2d'),nx=$('next').getContext('2d');
let grid=[],piece=null,queue=[],bag=[],score=0,lines=0,level=1,best=0,mode='easy',state='ready',last=0,fall=0,ground=0,resets=0,particles=[],flashRows=[],flashUntil=0,messageUntil=0;
try{best=Number(localStorage.getItem('seowoo-block-best'))||0}catch(e){}$('best').textContent=best;
let ac=null,soundOn=true,musicOn=true,musicTimer=null,noteIndex=0;
const melody=[72,76,79,76,74,77,81,77,76,79,84,79,77,76,74,67,72,76,79,84,81,79,76,74,77,81,79,76,74,71,72,null];
function unlockAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume().catch(()=>{});const b=ac.createBufferSource();b.buffer=ac.createBuffer(1,1,ac.sampleRate);b.connect(ac.destination);b.start()}catch(e){}}
function tone(freq,duration=.1,volume=.06,type='sine',delay=0){if(!ac||!soundOn||ac.state!=='running')return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(volume,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+duration+.02)}
function sfx(type){if(type==='move')tone(330,.045,.023);if(type==='rotate'){tone(520,.09,.04);tone(660,.09,.025,'sine',.035)}if(type==='lock'){tone(196,.12,.05,'triangle');tone(294,.1,.025)}if(type==='clear')[523,659,784,1047].forEach((f,i)=>tone(f,.3,.07,'sine',i*.075));if(type==='end')[392,330,262].forEach((f,i)=>tone(f,.5,.05,'triangle',i*.18))}
function musicStart(){musicStop();if(!soundOn||!musicOn||state!=='playing')return;musicTimer=setInterval(()=>{if(state!=='playing')return;const n=melody[noteIndex++%melody.length];if(n){tone(440*Math.pow(2,(n-69)/12),.45,.024);if(noteIndex%4===1)tone(440*Math.pow(2,(n-81)/12),.65,.015,'triangle')}},390)}
function musicStop(){clearInterval(musicTimer);musicTimer=null}
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').hidden=true,1800)}
function msg(text){$('message').textContent=text;messageUntil=performance.now()+2600}
function matrix(type){return SHAPES[type].map(r=>r.slice())}
function randomType(){if(!bag.length){bag=Object.keys(SHAPES);for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}return bag.pop()}
function collides(p,dx=0,dy=0,m=p.m){return m.some((row,y)=>row.some((v,x)=>v&&(p.x+x+dx<0||p.x+x+dx>=W||p.y+y+dy>=H||(p.y+y+dy>=0&&grid[p.y+y+dy][p.x+x+dx]))))}
function spawn(){const type=queue.shift();queue.push(randomType());const m=matrix(type);piece={type,m,x:Math.floor((W-m[0].length)/2),y:0};fall=0;ground=0;resets=0;drawNext();if(collides(piece))endGame()}
function updateStats(){$('score').textContent=score.toLocaleString('ko-KR');$('lines').textContent=lines;$('level').textContent=level;if(score>best){best=score;$('best').textContent=best.toLocaleString('ko-KR');try{localStorage.setItem('seowoo-block-best',String(best))}catch(e){}}}
function startGame(){unlockAudio();grid=Array.from({length:H},()=>Array(W).fill(null));bag=[];queue=Array.from({length:3},randomType);score=0;lines=0;level=1;particles=[];flashRows=[];state='playing';$('overlay').hidden=true;updateStats();spawn();last=performance.now();musicStart();msg('서우야, 우리 같이 해 보자!');sfx('rotate')}
function groundedReset(){if(resets<15){ground=0;resets++}}
function move(dx){if(state!=='playing'||!piece)return;if(!collides(piece,dx,0)){piece.x+=dx;groundedReset();sfx('move')}}
function rotate(){if(state!=='playing'||!piece)return;const m=piece.m[0].map((_,i)=>piece.m.map(r=>r[i]).reverse());for(const [x,y]of [[0,0],[-1,0],[1,0],[-2,0],[2,0],[0,-1],[-1,-1],[1,-1],[0,-2]]){if(!collides(piece,x,y,m)){piece.m=m;piece.x+=x;piece.y+=y;groundedReset();sfx('rotate');return}}}
function down(manual=true){if(state!=='playing'||!piece)return;if(!collides(piece,0,1)){piece.y++;ground=0;if(manual){score++;updateStats()}}}
function drop(){if(state!=='playing'||!piece)return;let n=0;while(!collides(piece,0,1)){piece.y++;n++}score+=n*2;lock()}
function lock(){if(state!=='playing'||!piece)return;piece.m.forEach((r,y)=>r.forEach((v,x)=>{if(v&&piece.y+y>=0)grid[piece.y+y][piece.x+x]=piece.type}));const full=[];for(let y=0;y<H;y++)if(grid[y].every(Boolean))full.push(y);if(full.length){flashRows=full;flashUntil=performance.now()+200;for(const y of full)for(let i=0;i<12;i++)particles.push({x:Math.random()*400,y:y*40+20,vx:(Math.random()-.5)*120,vy:-40-Math.random()*120,life:1,color:Object.values(COLORS)[i%7]});grid=grid.filter((_,i)=>!full.includes(i));while(grid.length<H)grid.unshift(Array(W).fill(null));score+=([0,100,300,500,800][full.length]||800)*level;lines+=full.length;level=1+Math.floor(lines/10);sfx('clear');msg(full.length===4?'네 줄이나! 서우 정말 멋져!':`${full.length}줄 반짝! 잘했어, 서우야!`);$('cheer').innerHTML='와아, 반짝반짝!<br>정말 잘했어!'}else sfx('lock');updateStats();spawn()}
function showModal(title,text,button){$('modalTitle').innerHTML=title;$('modalText').innerHTML=text;$('start').textContent=button;$('modes').hidden=state!=='over';$('restart').hidden=state!=='paused';$('fine').textContent='서우의 속도로, 즐겁게 놀면 그걸로 충분해.';$('overlay').hidden=false;setTimeout(()=>$('start').focus(),30)}
function pause(){if(state!=='playing')return;state='paused';musicStop();release();showModal('잠깐, 쉬어 가자','친구들도 서우를 기다리고 있어.<br>준비되면 다시 함께 놀자!','계속 놀기')}
function resume(){if(state!=='paused')return;unlockAudio();state='playing';$('overlay').hidden=true;last=performance.now();musicStart()}
function endGame(){state='over';musicStop();release();sfx('end');showModal('차곡차곡, 잘했어!','이번 점수는 <strong>'+score.toLocaleString('ko-KR')+'점</strong>!<br>다시 놀면 또 새로운 마을이 될 거야.','다시 놀기')}
function rounded(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function block(c,x,y,s,type,ghost=false){c.save();if(ghost){c.strokeStyle='#bcae9b';c.lineWidth=1.8;c.setLineDash([4,3]);rounded(c,x+2,y+2,s-4,s-4,6);c.stroke();c.restore();return}c.fillStyle=COLORS[type];rounded(c,x+1,y+1,s-2,s-2,6);c.fill();c.strokeStyle='#75614b25';c.lineWidth=1;c.stroke();c.fillStyle='#ffffff5c';rounded(c,x+4,y+3,s-8,4,2);c.fill();if(s>=22){c.fillStyle='#6c5a4c';c.beginPath();c.arc(x+s*.36,y+s*.46,s*.035,0,7);c.arc(x+s*.64,y+s*.46,s*.035,0,7);c.fill();c.strokeStyle='#6c5a4c';c.lineWidth=Math.max(1,s*.025);c.beginPath();c.arc(x+s*.5,y+s*.51,s*.08,0,Math.PI);c.stroke();c.fillStyle='#ec8e9e75';c.beginPath();c.ellipse(x+s*.22,y+s*.58,s*.085,s*.04,0,0,7);c.ellipse(x+s*.78,y+s*.58,s*.085,s*.04,0,0,7);c.fill()}c.restore()}
function drawNext(){nx.clearRect(0,0,150,330);queue.forEach((t,i)=>{const m=matrix(t),s=26,ox=(150-m[0].length*s)/2,oy=i*106+23; m.forEach((r,y)=>r.forEach((v,x)=>{if(v)block(nx,ox+x*s,oy+y*s,s,t)}))})}
function render(now,dt){ctx.clearRect(0,0,400,800);ctx.strokeStyle='#efe9df';ctx.lineWidth=1;for(let x=1;x<W;x++){ctx.beginPath();ctx.moveTo(x*40,0);ctx.lineTo(x*40,800);ctx.stroke()}for(let y=1;y<H;y++){ctx.beginPath();ctx.moveTo(0,y*40);ctx.lineTo(400,y*40);ctx.stroke()}grid.forEach((r,y)=>r.forEach((v,x)=>{if(v)block(ctx,x*40,y*40,40,v)}));if(piece&&state!=='ready'){let gy=0;while(!collides(piece,0,gy+1))gy++;piece.m.forEach((r,y)=>r.forEach((v,x)=>{if(v){block(ctx,(piece.x+x)*40,(piece.y+y+gy)*40,40,piece.type,true);block(ctx,(piece.x+x)*40,(piece.y+y)*40,40,piece.type)}}))}if(now<flashUntil){ctx.fillStyle='#fff2b8';ctx.globalAlpha=(flashUntil-now)/200*.7;flashRows.forEach(y=>ctx.fillRect(0,y*40,400,40));ctx.globalAlpha=1}particles.forEach(p=>{p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;p.vy+=160*dt/1000;p.life-=dt/700;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,6,6)});ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0)}
function frame(now){const dt=Math.min(now-last,80);last=now;if(state==='playing'&&piece){fall+=dt;const speed=Math.max(130,(mode==='easy'?1200:760)*Math.pow(.85,level-1));if(fall>=speed){down(false);fall=0}if(collides(piece,0,1)){ground+=dt;if(ground>480)lock()}else ground=0;if(messageUntil&&now>messageUntil){$('message').textContent='한 줄을 채우면 반짝! 사라져요.';messageUntil=0}}render(now,dt);requestAnimationFrame(frame)}
let repeatDelay=null,repeatTimer=null;function release(){clearTimeout(repeatDelay);clearInterval(repeatTimer);repeatDelay=repeatTimer=null}
const actions={left:()=>move(-1),right:()=>move(1),rotate,down:()=>down(true),drop};
document.querySelectorAll('[data-action]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='playing')return;unlockAudio();release();b.setPointerCapture(e.pointerId);const a=b.dataset.action;actions[a]();if(['left','right','down'].includes(a))repeatDelay=setTimeout(()=>{repeatTimer=setInterval(actions[a],a==='down'?65:90)},210)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,release))});
let swipe=null;canvas.addEventListener('pointerdown',e=>{if(state!=='playing')return;e.preventDefault();swipe={x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,moved:false};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!swipe||state!=='playing')return;const dx=e.clientX-swipe.lastX,dy=e.clientY-swipe.lastY;if(Math.abs(dx)>18){move(dx>0?1:-1);swipe.lastX=e.clientX;swipe.moved=true}if(dy>22){down(true);swipe.lastY=e.clientY;swipe.moved=true}});canvas.addEventListener('pointerup',()=>{if(swipe&&!swipe.moved)rotate();swipe=null});canvas.addEventListener('pointercancel',()=>swipe=null);
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&(e.code==='Space'||e.code==='Enter'))return;const map={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',ArrowUp:'rotate',Space:'drop'};if(map[e.code]){e.preventDefault();if(!e.repeat||!['drop','rotate'].includes(map[e.code]))actions[map[e.code]]()}if(e.code==='Escape'||e.code==='KeyP'){e.preventDefault();state==='playing'?pause():resume()}});
$('start').onclick=()=>state==='paused'?resume():startGame();$('restart').onclick=()=>{startGame()};$('pause').onclick=()=>state==='playing'?pause():state==='paused'?resume():toast('시작 버튼을 눌러 함께 놀자!');
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
$('sound').onclick=()=>{unlockAudio();soundOn=!soundOn;$('sound').textContent=soundOn?'소리 켬':'소리 끔';$('sound').setAttribute('aria-label',soundOn?'소리 끄기':'소리 켜기');$('sound').setAttribute('aria-pressed',String(soundOn));soundOn?musicStart():musicStop();if(soundOn)sfx('rotate')};
$('music').onclick=()=>{unlockAudio();musicOn=!musicOn;$('music').textContent=musicOn?'음악 켬':'음악 끔';$('music').setAttribute('aria-label',musicOn?'배경음 끄기':'배경음 켜기');$('music').setAttribute('aria-pressed',String(musicOn));musicOn?musicStart():musicStop();if(musicOn&&!soundOn)toast('소리를 켜면 음악도 들려요')};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('blur',()=>{release();if(state==='playing')pause()});window.addEventListener('pagehide',()=>{release();pause()});
grid=Array.from({length:H},()=>Array(W).fill(null));queue=['T','O','I'];drawNext();last=performance.now();requestAnimationFrame(frame);
// 검증 도구는 주소에 ?test=1을 넣었을 때만 활성화됩니다.
if(new URLSearchParams(location.search).has('test'))window.gameTest={start:startGame,move,rotate,drop,down,pause,resume,collides,lock,getState:()=>({state,grid:structuredClone(grid),piece:structuredClone(piece),score,lines,level,queue:[...queue],mode}),setBoard:(g)=>{grid=g.map(r=>r.slice())},setPiece:p=>{piece=structuredClone(p)},setMode:m=>{mode=m}};
</script>
</body></html>
