}.wordrow{grid-template-columns:20px 1fr 1fr 26px;gap:5px}.wordrow input{padding:10px 7px;font-size:12px}.route-item{gap:10px;padding:17px 13px}.route-item .num{width:34px;height:34px;font-size:15px}.route-item .btn{padding:9px 10px;min-height:42px}.route-copy h3{font-size:13px}.route-copy p{font-size:11px}.question{padding:26px 19px}.question-word{font-size:36px}.footer{align-items:flex-start;line-height:1.8}.footer>span{max-width:230px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<header><button class="brand" id="brand" aria-label="첫 화면"><svg viewBox="0 0 40 44" fill="none" aria-hidden="true"><path d="M20 39V17" stroke="#356859" stroke-width="3" stroke-linecap="round"/><path d="M20 26C5 26 4 17 5 10C15 9 22 13 20 26Z" fill="#88b49c"/><path d="M20 19C18 7 26 2 36 3C37 13 31 20 20 19Z" fill="#356859"/><path d="M9 40H31" stroke="#356859" stroke-width="3" stroke-linecap="round"/></svg>단어 새싹</button><span class="header-note">하루 한 묶음, 차근차근</span></header>
<main id="app" class="wrap"></main><div id="toast" class="toast hide" role="status"></div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>
<script>
'use strict';
const KEY='word-garden-v1';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let db={version:1,batches:[]},storageOK=true,activeId=null,draft=[],ocrBusy=false,worker=null;
try{const raw=localStorage.getItem(KEY);if(raw)db=validateDB(JSON.parse(raw));}catch(e){storageOK=false;}
function validateDB(x){if(x?.version!==1||!Array.isArray(x.batches))throw Error('파일 형식이 다릅니다.');let ids=new Set();for(const b of x.batches){if(!b||typeof b.id!=='string'||ids.has(b.id)||typeof b.title!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(b.date)||!Array.isArray(b.words)||!b.words.length||b.words.length>1000||!Array.isArray(b.done)||b.done.length!==3||b.done.some(v=>typeof v!=='boolean')||(b.done[1]&&!b.done[0])||(b.done[2]&&!b.done[1]))throw Error('단어 묶음 정보를 확인해 주세요.');ids.add(b.id);let wids=new Set();for(const w of b.words){if(!w||typeof w.id!=='string'||wids.has(w.id)||typeof w.en!=='string'||!w.en.trim()||typeof w.ko!=='string'||!w.ko.trim()||!Array.isArray(w.errors)||w.errors.length!==2||w.errors.some(n=>!Number.isSafeInteger(n)||n<0))throw Error('단어 정보를 확인해 주세요.');wids.add(w.id)}if(b.session){const s=b.session;if(![1,2,3].includes(s.stage)||!Array.isArray(s.queue)||!s.queue.length||s.queue.some(q=>!wids.has(q.id)||![1,2].includes(q.dir))||!Number.isInteger(s.index)||s.index<0||s.index>s.queue.length||!Array.isArray(s.results)||s.results.length!==s.index||s.results.some(r=>!wids.has(r.id)||typeof r.correct!=='boolean'||![1,2].includes(r.dir))||s.queue.length!==(s.stage===3?20:b.words.length)||(s.stage>1&&!b.done[s.stage-2]))throw Error('학습 진행 정보를 확인해 주세요.');}}return x;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true;}catch(e){storageOK=false;toast('저장이 제한됐어요. 단어장을 백업해 주세요.');}}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hide');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.add('hide'),4000)}
function current(){return db.batches.find(b=>b.id===activeId)}
function go(fn){window.scrollTo(0,0);fn()}
$('#brand').onclick=()=>go(home);
function iconPlant(n){const base='<path d="M15 66H65" stroke="#9db9a9" stroke-width="2" stroke-linecap="round"/>';return `<svg viewBox="0 0 80 72" aria-hidden="true" fill="none">${base}${n===1?'<path d="M40 64V41" stroke="#356859" stroke-width="3"/><path d="M40 48C22 47 23 33 24 28C37 27 43 36 40 48Z" fill="#88b49c"/><path d="M40 42C37 27 48 22 59 24C60 36 53 43 40 42Z" fill="#356859"/>':n===2?'<path d="M40 64V20" stroke="#356859" stroke-width="3"/><path d="M40 48C20 48 17 35 20 27C34 27 43 35 40 48Z" fill="#88b49c"/><path d="M40 34C36 17 48 12 63 14C62 29 54 35 40 34Z" fill="#356859"/><path d="M40 24C28 23 27 14 29 9C38 9 42 15 40 24Z" fill="#abc8b2"/>':'<path d="M40 64V27" stroke="#356859" stroke-width="3"/><path d="M40 52C22 52 20 40 22 33C36 33 43 42 40 52Z" fill="#88b49c"/><path d="M40 43C37 28 48 23 61 25C61 37 53 44 40 43Z" fill="#356859"/><circle cx="40" cy="18" r="16" fill="#f6df87"/><circle cx="40" cy="18" r="6" fill="#b18a23"/>'}</svg>`}
function home(){activeId=null;$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">나만의 영단어 정원</div><h1>오늘 외운 단어가<br>내일의 실력이 돼요.</h1><p>사진으로 담고, 세 번 익혀요.<br>헷갈렸던 단어는 한 번 더 만나게 될 거예요.</p></div><div class="garden"><div class="garden-label"><span>단어가 자라는 세 단계</span><span>차례대로 도전!</span></div><div class="path"><div class="plant">${iconPlant(1)}<strong>1. 뜻 떠올리기</strong><small>영어 → 한글</small></div><div class="step-line"></div><div class="plant">${iconPlant(2)}<strong>2. 철자 써 보기</strong><small>한글 → 영어</small></div><div class="step-line"></div><div class="plant">${iconPlant(3)}<strong>3. 실력 확인</strong><small>오답 중심 20문제</small></div></div></div></section><section><div class="toolbar"><div><h2>날짜별 단어장</h2><small>${db.batches.length?'배운 날을 골라 이어서 공부해요.':'첫 단어 묶음을 심어 볼까요?'}</small></div><button class="btn" id="newBatch">＋ 단어 담기</button></div><div class="grid">${db.batches.length?db.batches.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(b=>{let done=b.done.filter(Boolean).length;return `<article class="card"><span class="mini-tag">${done===3?'세 단계 완료':b.session?'학습 중':done?'다음 단계 준비':'새 단어 묶음'}</span><h3 class="batch-title">${esc(b.title)}</h3><div class="batch-date">${esc(b.date)} · ${b.words.length}개 단어</div><div class="steps">${b.done.map(v=>`<span class="step ${v?'done':''}"></span>`).join('')}</div><div class="card-bottom"><small>${done} / 3단계 완료</small><button class="btn secondary" data-open="${esc(b.id)}">${done===3?'다시 공부하기':'공부하기'} →</button></div></article>`}).join(''):`<div class="empty"><span class="mini-tag">사진 한 장으로 시작해요</span><h3>아직 심은 단어가 없어요.</h3><p>영어와 한글 뜻이 함께 적힌 사진을 올려 주세요.<br>직접 단어를 입력해도 좋아요.</p><button class="btn secondary" id="emptyAdd">첫 단어 묶음 만들기</button></div>`}</div></section><footer class="footer"><span>이 브라우저에 저장돼요. 기기 변경·기록 삭제 전 꼭 백업해 주세요.</span><div><button class="textbtn" id="backup">백업 저장</button><button class="textbtn" id="restore">백업 불러오기</button></div></footer>${!storageOK?'<div class="notice warn">브라우저 저장소를 사용할 수 없어요. 백업 파일로 기록을 보관해 주세요.</div>':''}`;$('#newBatch').onclick=()=>go(create);if($('#emptyAdd'))$('#emptyAdd').onclick=()=>go(create);document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{activeId=el.dataset.open;go(detail)});$('#backup').onclick=backup;$('#restore').onclick=()=>$('#restoreFile').click();}
function create(){draft=[];$('#app').innerHTML=`<div class="view"><button class="back" id="back">← 단어장으로</button><div class="heading"><div class="eyebrow">새 단어 묶음</div><h1>오늘의 단어를 담아요.</h1><p class="muted">사진 속 영어와 한글 뜻을 읽은 뒤, 함께 확인해요.</p></div><section class="panel"><div class="cols"><div class="field"><label for="batchDate">공부할 날짜</label><input type="date" id="batchDate" value="${today()}"></div><div class="field"><label for="batchTitle">묶음 이름</label><input id="batchTitle" maxlength="50" placeholder="예: 학교 단어 1일차"></div></div><label class="upload"><input id="photo" type="file" accept="image/*" multiple aria-label="단어 사진 선택"><strong>＋ 단어 사진 올리기</strong><small>아이폰에서 사진을 고르거나 촬영할 수 있어요.<br>영어·한글이 함께 보이도록 선명하게 찍어 주세요.</small></label><div id="ocrStatus" class="hint" role="status" aria-live="polite"></div><progress id="ocrProgress" max="1" value="0" class="hide"></progress><div class="hint" style="margin-top:12px">사진은 이 브라우저 안에서 인식하며 별도로 서버에 저장하지 않아요. 첫 사용에는 인터넷 연결과 인식 자료 다운로드가 필요해요. 인식은 수십 초 이상 걸릴 수 있어요.</div><details><summary>직접 붙여 넣어서 단어 추가하기</summary><label class="hint" for="paste">한 줄에 영어와 뜻을 적어 주세요. 예: apple = 사과</label><textarea id="paste" placeholder="apple = 사과\nlibrary = 도서관\nkind = 친절한"></textarea><button class="btn secondary" id="parse" style="margin-top:10px">붙여 넣은 단어 추가</button></details></section><section class="panel"><h2 style="font-size:17px">단어 확인 <span id="wordCount" class="muted">0개</span></h2><p class="hint">사진 인식은 틀릴 수 있어요. 철자와 뜻을 꼭 확인하고 수정해 주세요. 여러 뜻은 쉼표 또는 / 로 나누면 모두 정답으로 인정해요.</p><div class="wordrow"><span></span><span>영어</span><span>한글 뜻</span><span></span></div><div id="wordRows" class="rows"></div><button class="textbtn" id="addRow">＋ 단어 한 줄 추가</button><div class="notice">저장 후 1단계부터 차례로 진행해요. 3단계는 영어·한글 문제를 10개씩 섞어 총 20문제를 출제해요.</div><button class="btn full" id="saveBatch">이 단어들로 시작하기</button></section></div>`;$('#back').onclick=()=>go(home);$('#photo').onchange=readPhotos;$('#parse').onclick=()=>{const parsed=parseText($('#paste').value);draft.push(...parsed.map(p=>({...p,id:uid()})));renderRows();toast(`${parsed.length}개를 가져왔어요. 내용과 누락된 단어를 확인해 주세요.`)};$('#addRow').onclick=()=>{draft.push({id:uid(),en:'',ko:''});renderRows();document.querySelector('#wordRows .wordrow:last-child input')?.focus()};$('#saveBatch').onclick=saveBatch;renderRows();}
function parseText(t){return t.split(/\r?\n/).map(l=>l.trim().replace(/^\d+[.)\s]+/,'')).filter(Boolean).map(l=>{const m=l.match(/^([A-Za-z][A-Za-z\s'’()\-.,]*?)\s*(?:\t|\s[=:\-–]\s|\s*[=:]\s*|\s+(?=[가-힣]))\s*(.+)$/);return m?{en:m[1].trim(),ko:m[2].trim()}:{en:l,ko:''}})}
function renderRows(){if(!$('#wordRows'))return;$('#wordCount').textContent=draft.length+'개';$('#wordRows').innerHTML=draft.map((w,i)=>`<div class="wordrow"><span>${i+1}</span><input aria-label="${i+1}번 영어" data-id="${w.id}" data-key="en" value="${esc(w.en)}" autocapitalize="none" autocomplete="off" spellcheck="false"><input aria-label="${i+1}번 한글 뜻" data-id="${w.id}" data-key="ko" value="${esc(w.ko)}"><button class="remove" data-remove="${w.id}" aria-label="${i+1}번 삭제">×</button></div>`).join('');$('#wordRows').querySelectorAll('input').forEach(el=>el.oninput=()=>{const w=draft.find(w=>w.id===el.dataset.id);if(w)w[el.dataset.key]=el.value});$('#wordRows').querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{draft=draft.filter(w=>w.id!==el.dataset.remove);renderRows()});}
function loadOCR(){if(window.Tesseract)return Promise.resolve();return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=resolve;s.onerror=()=>{s.remove();reject(Error('사진 인식 도구를 불러오지 못했어요. 인터넷 연결을 확인하거나 직접 입력해 주세요.'))};document.head.append(s)})}
async function readPhotos(e){if(ocrBusy)return;const files=[...e.target.files];if(!files.length)return;ocrBusy=true;$('#saveBatch').disabled=true;$('#photo').disabled=true;$('#ocrProgress').classList.remove('hide');let allText='',count=0;try{await loadOCR();worker=await Tesseract.createWorker('eng+kor',1,{logger:m=>{if(!$('#ocrStatus'))return;if(m.status==='recognizing text'){$('#ocrStatus').textContent=`사진 ${count+1}/${files.length} · 글자를 읽고 있어요. ${Math.round(m.progress*100)}%`;$('#ocrProgress').value=m.progress}else $('#ocrStatus').textContent='사진 인식 자료를 준비하고 있어요…'}});for(const f of files){if(f.size>20*1024*1024)throw Error('사진 한 장은 20MB 이하로 골라 주세요.');let image=await resizePhoto(f);let result=await worker.recognize(image);allText+=result.data.text+'\n';count++}const parsed=parseText(allText);draft.push(...parsed.map(p=>({...p,id:uid()})));renderRows();if($('#ocrStatus'))$('#ocrStatus').textContent=parsed.length?`${files.length}장 읽기 완료 · ${parsed.length}줄을 가져왔어요. 단어 연결과 누락을 확인해 주세요. 한글 뜻이 비어 있으면 직접 채워 주세요.`:'글자를 읽지 못했어요. 더 선명하게 찍거나 직접 입력해 주세요.';}catch(err){if($('#ocrStatus'))$('#ocrStatus').textContent=err.message||'사진을 읽지 못했어요. JPG·PNG로 다시 선택하거나 직접 입력해 주세요.';}finally{if(worker){await worker.terminate().catch(()=>{});worker=null}ocrBusy=false;if($('#photo')){$('#photo').disabled=false;$('#photo').value='';$('#saveBatch').disabled=false;$('#ocrProgress').classList.add('hide')}}}
async function resizePhoto(file){const url=URL.createObjectURL(file);try{const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(Error('이 사진 형식을 읽지 못했어요. JPG·PNG 또는 화면 캡처로 다시 올려 주세요.'));i.src=url});const ratio=Math.min(1,2400/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.94)}finally{URL.revokeObjectURL(url)}}
function saveBatch(){if(ocrBusy)return;const date=$('#batchDate').value,words=draft.map(w=>({id:w.id,en:w.en.trim(),ko:w.ko.trim(),errors:[0,0]}));if(!date)return toast('공부할 날짜를 선택해 주세요.');if(!words.length)return toast('단어를 한 개 이상 추가해 주세요.');if(words.some(w=>!w.en||!w.ko))return toast('모든 줄에 영어와 한글 뜻을 채워 주세요.');if(words.length>1000)return toast('한 묶음에는 1,000개까지 저장할 수 있어요.');const same=db.batches.find(b=>b.date===date);if(same&&!confirm('같은 날짜의 묶음이 있어요. 별도의 새 묶음으로 저장할까요?'))return;const b={id:uid(),date,title:$('#batchTitle').value.trim()||'오늘의 단어',words,done:[false,false,false],session:null,history:[]};db.batches.push(b);save();activeId=b.id;go(detail)}
function detail(){const b=current();if(!b)return home();$('#app').innerHTML=`<div class="view"><button class="back" id="back">← 날짜별 단어장</button><div class="heading"><div class="eyebrow">${esc(b.date)} · ${b.words.length}개 단어</div><h1>${esc(b.title)}</h1><p class="muted">한 단계씩 익히면, 다음 단계가 열려요.</p></div>${b.session?`<div class="notice">${b.session.stage}단계 ${b.session.index}/${b.session.queue.length}문제 진행 중이에요. 아래 버튼으로 이어서 할 수 있어요.</div>`:''}${[1,2,3].map((n)=>{let locked=n>1&&!b.done[n-2];return `<div class="route-item ${locked?'locked':''}"><span class="num">${b.done[n-1]?'✓':n}</span><div class="route-copy"><h3>${['영어 보고 뜻 맞추기','뜻 보고 영어 쓰기','오답 중심 랜덤 테스트'][n-1]}</h3><p>${['모든 단어의 한글 뜻을 떠올려요.','모든 단어의 영어 철자를 써 봐요.','헷갈린 단어를 먼저, 총 20문제!'][n-1]}</p></div><button class="btn ${b.done[n-1]?'secondary':''}" data-stage="${n}" ${locked?'disabled':''}>${locked?'잠김':b.session?.stage===n?'이어서':b.done[n-1]?'다시':'시작'}</button></div>`}).join('')}<div class="notice">마지막 시험은 1·2단계의 누적 오답을 반영해요. 자주 틀린 단어일수록 뽑힐 가능성이 커요.${b.words.length<20?' 이 묶음은 20개 미만이어서 일부 단어가 반복돼요.':''}</div><details><summary>단어와 오답 기록 보기</summary><div class="panel">${b.words.map(w=>`<div class="review-row"><div><strong>${esc(w.en)}</strong><div class="hint">뜻 ${w.errors[0]}회 · 철자 ${w.errors[1]}회 틀림</div></div><span>${esc(w.ko)}</span></div>`).join('')}</div></details>${b.history?.length?`<details><summary>최근 테스트 기록</summary><div class="panel">${b.history.slice(-10).reverse().map(h=>`<div class="review-row"><span>${esc(h.date)}</span><strong>${h.score} / 20</strong></div>`).join('')}</div></details>`:''}<div class="actions" style="margin-top:24px"><button class="btn ghost" id="backup">백업 저장</button><button class="btn danger" id="delete">묶음 삭제</button></div></div>`;$('#back').onclick=()=>go(home);document.querySelectorAll('[data-stage]').forEach(el=>el.onclick=()=>start(Number(el.dataset.stage)));$('#backup').onclick=backup;$('#delete').onclick=()=>{if(confirm('이 묶음의 단어와 학습 기록을 삭제할까요? 되돌릴 수 없어요.')){db.batches=db.batches.filter(x=>x.id!==b.id);save();go(home)}};}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function weightedPick(pool){const weights=pool.map(w=>1+4*(w.errors[0]+w.errors[1])),total=weights.reduce((a,b)=>a+b,0);let r=Math.random()*total;for(let i=0;i<pool.length;i++){r-=weights[i];if(r<0)return i}return pool.length-1}
function testQueue(words){let chosen=[],pool=[],last=null;const wrong=words.filter(w=>w.errors[0]+w.errors[1]>0);if(words.length>=20){let wp=wrong.slice();for(let i=0;i<Math.min(14,wrong.length);i++){let j=weightedPick(wp);chosen.push(wp.splice(j,1)[0])}pool=words.filter(w=>!chosen.some(x=>x.id===w.id));while(chosen.length<20){const j=weightedPick(pool);chosen.push(pool.splice(j,1)[0])}chosen=shuffle(chosen);}else{pool=words.slice();for(let i=0;i<20;i++){const source=i<words.length?pool:words;let available=source.filter(w=>w.id!==last);if(!available.length)available=source;const w=available[weightedPick(available)];chosen.push(w);pool=pool.filter(x=>x.id!==w.id);last=w.id;}}const dirs=shuffle([...Array(10).fill(1),...Array(10).fill(2)]);return chosen.map((w,i)=>({id:w.id,dir:dirs[i]}))}
function start(stage){const b=current();if(stage>1&&!b.done[stage-2])return;if(b.session?.stage===stage)return go(study);if(b.session&&!confirm('다른 단계가 진행 중이에요. 그 진행을 마치지 않고 새로 시작할까요? 이미 기록된 오답은 유지돼요.'))return;b.session={stage,queue:stage===3?testQueue(b.words):shuffle(b.words).map(w=>({id:w.id,dir:stage})),index:0,results:[]};save();go(study)}
function normalize(s){return s.normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/[\s.!?。]+/g,'').trim()}
function isCorrect(input,expected,dir){const n=normalize(input);if(!n)return false;if(dir===2)return n===normalize(expected);return [expected,...expected.split(/[,，/;；\n]|\s+또는\s+/)].some(a=>n===normalize(a))}
function study(){const b=current(),s=b?.session;if(!s)return detail();if(s.index>=s.queue.length)return finish();const q=s.queue[s.index],w=b.words.find(x=>x.id===q.id);$('#app').innerHTML=`<div class="study"><button class="back" id="pause">← 저장하고 나가기</button><div class="study-top"><span>${s.stage}단계 · ${s.stage===3?'랜덤 테스트':q.dir===1?'뜻 떠올리기':'철자 써 보기'}</span><strong>${s.index+1} / ${s.queue.length}</strong></div><div class="progress"><div style="width:${s.index/s.queue.length*100}%"></div></div><section class="question"><span class="mini-tag">${q.dir===1?'영어 → 한글':'한글 → 영어'}</span><div class="question-word">${esc(q.dir===1?w.en:w.ko)}</div><p class="prompt" id="answerLabel">${q.dir===1?'한글 뜻을 적어 주세요.':'영어 철자를 적어 주세요.'}</p><form id="answerForm"><input id="answerInput" aria-labelledby="answerLabel" placeholder="여기에 정답 쓰기" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done"><button class="btn full" type="submit">정답 확인</button><button class="textbtn" id="skip" type="button">모르겠어요</button></form><div id="feedback" aria-live="polite"></div></section><p class="hint" style="text-align:center">${s.stage===3?'시험 중 오답은 따로 복습할 수 있어요.':'괜찮아요. 틀린 단어는 마지막 시험에서 다시 만나요.'}</p></div>`;$('#pause').onclick=()=>go(detail);$('#answerForm').onsubmit=e=>{e.preventDefault();const a=$('#answerInput').value.trim();if(!a)return toast('답을 쓰거나 ‘모르겠어요’를 눌러 주세요.');reveal(isCorrect(a,q.dir===1?w.ko:w.en,q.dir),a)};$('#skip').onclick=()=>reveal(false,'');}
function reveal(correct,input){const b=current(),s=b.session,q=s.queue[s.index],w=b.words.find(x=>x.id===q.id);$('#answerForm').classList.add('hide');$('#feedback').innerHTML=`<div class="answer ${correct?'':'wrong'}"><strong>${correct?'맞았어요!':'정답을 함께 기억해요.'}</strong><div>${esc(w.en)} = ${esc(w.ko)}</div><small>${input?'내 답: '+esc(input):'이번에는 모르겠어요를 골랐어요.'}</small></div>${!correct&&q.dir===1&&input?'<button class="textbtn" id="override">표현만 달라요 · 맞았어요로 처리</button>':''}<button class="btn full" id="next">${s.index+1===s.queue.length?'결과 보기':'다음 단어 →'}</button>`;let accepted=correct;$('#override')?.addEventListener('click',()=>{accepted=true;$('#feedback .answer').classList.remove('wrong');$('#feedback .answer strong').textContent='맞았어요로 바꿨어요.';$('#override').remove()});$('#next').onclick=()=>{if(s.stage<3&&!accepted)w.errors[q.dir-1]++;s.results.push({id:w.id,dir:q.dir,correct:accepted});s.index++;save();go(study)};}

function pronMarkup(word){if(!word?.trim())return '';return `<div class="pronunciation" data-word="${esc(word)}"><span class="ipa">발음기호 확인 전</span><button class="pron-btn" data-listen="${esc(word)}" type="button" aria-label="${esc(word)} 미국식 발음 듣기">미국 발음 듣기</button><button class="pron-btn subtle" data-lookup="${esc(word)}" type="button">발음기호 보기</button><span class="pron-source"></span></div>`}
function bindPron(root){root.querySelectorAll('[data-listen]').forEach(el=>el.onclick=()=>{speakUS(el.dataset.listen);lookupPron(el.closest('.pronunciation'))});root.querySelectorAll('[data-lookup]').forEach(el=>el.onclick=()=>lookupPron(el.closest('.pronunciation')));root.querySelectorAll('.pronunciation').forEach(box=>{const p=pronCache[box.dataset.word.toLowerCase()];if(p?.ipa)showPron(box,p)})}
function speakUS(word){if(!('speechSynthesis'in window))return toast('이 브라우저에서 음성 재생을 지원하지 않아요. 아이폰 Safari에서 열어 주세요.');voices=speechSynthesis.getVoices();const voice=voices.find(v=>/^en[-_]US$/i.test(v.lang));if(!voice)return toast('미국 영어 음성을 찾지 못했어요. 아이폰의 음성 설정에서 미국 영어 음성을 추가한 뒤 다시 열어 주세요.');speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(word);utterance.lang='en-US';utterance.voice=voice;utterance.rate=.8;utterance.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))toast('발음이 재생되지 않았어요. 소리 설정을 확인하고 다시 눌러 주세요.')};speechSynthesis.speak(utterance)}
function choosePron(data){const all=(data.entries||[]).filter(e=>e.language?.code==='en').flatMap(e=>e.pronunciations||[]).filter(p=>p.type==='ipa'&&p.text);const us=all.find(p=>p.tags?.some(t=>/general american|united states|american english|^us$|^usa$/i.test(t)));const neutral=all.find(p=>!p.tags?.length);const p=us||neutral;if(!p)return {ipa:'',message:'미국식 발음기호를 찾지 못했어요.'};return {ipa:p.text,kind:us?'미국':'공통',source:data.source?.url,license:data.source?.license}}
function showPron(box,p){box.querySelector('.ipa').textContent=p.ipa?`${p.ipa} · ${p.kind}`:p.message;const slot=box.querySelector('.pron-source');slot.replaceChildren();if(p.ipa){const a=document.createElement('a');a.textContent='발음기호 출처';if(/^https:\/\/en\.wiktionary\.org\//.test(p.source||'')){a.href=p.source;a.target='_blank';a.rel='noopener';slot.append(a)}}}
async function lookupPron(box){const word=box.dataset.word.trim().toLowerCase();if(!word)return;if(pronCache[word]?.ipa)return showPron(box,pronCache[word]);const el=box.querySelector('.ipa');el.textContent='발음기호 찾는 중…';try{let pending=pronCache[word]?.pending;if(!pending){pending=(async()=>{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const res=await fetch('https://freedictionaryapi.com/api/v1/entries/en/'+encodeURIComponent(word),{signal:controller.signal});if(!res.ok)throw Error('사전 연결 실패');return choosePron(await res.json())}finally{clearTimeout(timer)}})();pronCache[word]={pending}}const p=await pending;pronCache[word]=p;document.querySelectorAll('.pronunciation').forEach(b=>{if(b.dataset.word.trim().toLowerCase()===word)showPron(b,p)})}catch(e){delete pronCache[word];el.textContent='발음기호를 불러오지 못했어요. 다시 눌러 주세요.'}}
const originalCreate=create;create=function(){originalCreate();$('#photo').closest('.upload').insertAdjacentHTML('afterend','<div id="photoReview" class="notice hide"></div>');const hint=$('#wordCount').closest('section').querySelector('p');hint.textContent='영어와 뜻이 같은 행인지 확인해 주세요. 여러 뜻은 쉼표로 구분해요. 예: 덮다, 가리다. 세미콜론도 자동으로 쉼표로 바뀌어요.';$('#saveBatch').closest('section').insertAdjacentHTML('beforeend','<p class="hint">미국 발음은 아이폰의 미국 영어 음성으로 읽어요. 발음기호 조회 시 영어 단어만 외부 사전에 전송돼요. 발음기호: <a href="https://freedictionaryapi.com/" target="_blank" rel="noopener">FreeDictionaryAPI.com</a> · Wiktionary (CC BY-SA 4.0).</p>');$('#parse').onclick=()=>{const parsed=parseText($('#paste').value);draft.push(...parsed.map(p=>({...p,ko:cleanMeaning(p.ko),id:uid()})));renderRows();toast(`${parsed.length}개를 목록 아래에 추가했어요.`)}};
const originalRenderRows=renderRows;renderRows=function(){originalRenderRows();$('#wordRows')?.querySelectorAll('input[data-key="ko"]').forEach(input=>{const field=document.createElement('textarea');for(const a of input.attributes)field.setAttribute(a.name,a.value);field.value=input.value;field.rows=2;field.oninput=()=>{const w=draft.find(w=>w.id===field.dataset.id);if(w)w.ko=field.value};field.onchange=()=>{const w=draft.find(w=>w.id===field.dataset.id);if(w){w.ko=cleanMeaning(w.ko);field.value=w.ko}};input.replaceWith(field)})};
const originalSaveBatch=saveBatch;saveBatch=function(){draft.forEach(w=>w.ko=cleanMeaning(w.ko));originalSaveBatch()};
const originalStudy=study;study=function(){originalStudy();const b=current(),s=b?.session;if(!s||s.index>=s.queue.length)return;const q=s.queue[s.index],w=b.words.find(w=>w.id===q.id);if(q.dir===1){$('.question-word').insertAdjacentHTML('afterend',pronMarkup(w.en));bindPron($('.question'))}};
const originalReveal=reveal;reveal=function(correct,input){originalReveal(correct,input);const s=current().session,q=s.queue[s.index],w=current().words.find(w=>w.id===q.id);if(q.dir===2){$('#feedback .answer').insertAdjacentHTML('beforeend',pronMarkup(w.en));bindPron($('#feedback'))}};
const originalDetail=detail;detail=function(){originalDetail();const b=current();if(!b)return;const list=$('#app details .panel');if(list){list.querySelectorAll('.review-row').forEach((row,i)=>{const w=b.words[i];row.querySelector('strong').insertAdjacentHTML('afterend',pronMarkup(w.en))});bindPron(list)}};
const originalIsCorrect=isCorrect;isCorrect=function(input,expected,dir){if(dir===2)return originalIsCorrect(input,expected,dir);const choices=cleanMeaning(expected).split(',').map(x=>normalize(x)),answers=cleanMeaning(input).split(',').map(x=>normalize(x));return answers.length>0&&answers.every(a=>a&&choices.includes(a))||originalIsCorrect(input,expected,dir)};
const originalGo=go;go=function(fn){if(ocrBusy){toast('사진을 읽고 있어요. 완료될 때까지 기다려 주세요.');return}if('speechSynthesis'in window)speechSynthesis.cancel();originalGo(fn)};

home();
</script></body></html>
